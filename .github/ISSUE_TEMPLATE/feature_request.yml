name: Feature request
description: Suggest something specific for SCANCORE to do. Open-ended ideas fit better in Discussions.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Comics, Novels, Anime, Library and history, Downloads, Sources, Settings, Other]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other apps that do this well.
